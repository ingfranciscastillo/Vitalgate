name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same branch or PR makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Installs Node and the pnpm version pinned in package.json
      # ("packageManager"), then runs `pnpm install` — with a frozen lockfile,
      # since CI is set.
      - uses: pnpm/setup@v2
        with:
          cache: true

      - name: Lint and format
        run: pnpm exec biome ci

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
